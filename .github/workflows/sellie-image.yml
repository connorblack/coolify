name: Sellie Coolify image

# Builds the production image from the `sellie` branch at an upstream release tag plus the
# NixOS server-support commits, and publishes it as ghcr.io/connorblack/coolify:<upstream version>.
# The tag must equal the CDN version string so Coolify's own updater (upgrade.sh, LATEST_IMAGE)
# resolves it. See SELLIE.md.

on:
  push:
    tags: ["sellie/v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/connorblack/coolify

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
      short_sha: ${{ steps.v.outputs.short_sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: v
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#sellie/v}"
          CONFIG=$(docker run --rm -v "$PWD:/app" -w /app php:8.4-cli-alpine php bootstrap/getVersion.php)
          [ "$TAG" = "$CONFIG" ] || { echo "tag $TAG != config version $CONFIG"; exit 1; }
          git remote add upstream https://github.com/coollabsio/coolify
          git fetch --no-tags upstream "refs/tags/v$TAG:refs/tags/upstream-v$TAG"
          git merge-base --is-ancestor "upstream-v$TAG" HEAD || { echo "branch does not contain upstream v$TAG"; exit 1; }
          grep -q "'nixos'" bootstrap/helpers/constants.php
          ! grep -rq "nix-channel" app/
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  build:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/production/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            COOLIFY_VERSION=${{ needs.validate.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.validate.outputs.version }}
            ${{ env.IMAGE }}:${{ needs.validate.outputs.version }}-sellie.${{ needs.validate.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker buildx imagetools inspect "${IMAGE}:${{ needs.validate.outputs.version }}"
